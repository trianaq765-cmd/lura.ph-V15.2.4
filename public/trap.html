<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    
    <!-- Anti-cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Redirect loop dengan delay random -->
    <script>
        // Obfuscated redirect logic
        (function() {
            var _0x = ['href', 'location', 'random', 'floor', 'toString'];
            var targets = [
                'https://www.google.com/search?q=loading',
                'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                'about:blank',
                window.location.href + '?r=' + Math.random()
            ];
            
            // Fake loading
            document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;"><div style="text-align:center;color:#fff;font-family:Arial;"><div class="spinner" style="border:4px solid #333;border-top:4px solid #fff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:0 auto 20px;"></div><p>Loading resources...</p><p style="font-size:12px;color:#666;">Please wait...</p></div></div><style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>';
            
            // Random delay 2-5 detik, lalu redirect
            setTimeout(function() {
                var idx = Math.floor(Math.random() * targets.length);
                window.location.href = targets[idx];
            }, 2000 + Math.random() * 3000);
            
            // Disable right click
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // Disable F12
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                    window.location.href = 'about:blank';
                }
            });
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            overflow: hidden;
            user-select: none;
        }
    </style>
</head>
<body>
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://www.google.com">
    </noscript>
</body>
</html>
